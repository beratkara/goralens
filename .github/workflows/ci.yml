name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: Example application
        working-directory: examples/basic
        run: go test -race ./...
      - name: Redis hook
        working-directory: redishook
        run: |
          go vet ./...
          go test ./...
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: Coverage
        if: matrix.go == '1.26'
        run: |
          mkdir -p "$RUNNER_TEMP/cover/unit" "$RUNNER_TEMP/cover/example"
          go test -cover -coverpkg=github.com/beratkara/goralens . -args -test.gocoverdir="$RUNNER_TEMP/cover/unit"
          (cd examples/basic && go test -cover -coverpkg=github.com/beratkara/goralens . -args -test.gocoverdir="$RUNNER_TEMP/cover/example")
          go tool covdata percent -i="$RUNNER_TEMP/cover/unit,$RUNNER_TEMP/cover/example" -pkg=github.com/beratkara/goralens
